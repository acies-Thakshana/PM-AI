domain: generic_cube
entities:
  - logical_entity: generic_cube
    business_definition: >
      Denormalized analytical extract. Grain is defined by the data team
      in entities.yaml. The LLM proposes metrics; this file only grounds them.
    hierarchy: []
kpis:
  - family: primary_measure
    name: Primary measure
    business_definition: >
      Hint only. The LLM chooses the actual measure, grain, and calculation
      from columns + the living knowledge graph. Edit this file to add
      domain KPI names; do not change the engine.
    formula_hint: SUM or AVG of the measure the user asked for
    grain: cube
    owner: metric.owner
    synonyms:
      - kpi
      - metric
      - productivity
    scopes:
      - global
hierarchies: []
synonyms:
  - term: KPI
    maps_to: primary_measure
