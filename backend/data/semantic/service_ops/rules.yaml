rules:
  - id: rule.ops.frt_unit
    rule_type: definition
    description: First Response Time is reported in hours, from opened_at to first_response_at.
    applies_to: [metric.service_ops.frt_global, metric.service_ops.frt_emea, metric.service_ops.frt_apac]
    keywords: [frt, first response, response time]
    sql_hint: (julianday(first_response_at) - julianday(opened_at)) * 24.0

  - id: rule.ops.region_scope
    rule_type: filter
    description: >
      A region named in the question (EMEA, APAC, AMER) is a filter on cases.region,
      not a separate dataset.
    applies_to: [region]
    keywords: [emea, apac, amer, region]
    sql_hint: region = '<REGION>'

  - id: rule.ops.open_cases
    rule_type: definition
    description: An open case has status 'open'. Closed cases have status 'closed'.
    applies_to: [status]
    keywords: [open, closed, backlog]
    sql_hint: status = 'open'

  - id: rule.ops.no_contact_data
    rule_type: restriction
    description: Customer contact details are restricted and are never returned or used to filter.
    applies_to: [contact_email]
    keywords: [email, contact]
