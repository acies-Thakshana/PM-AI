examples:
  - question: What is EMEA FRT?
    intent: aggregation
    metric_ids: [metric.service_ops.frt_emea]
  - question: What is FRT by region?
    intent: breakdown
    metric_ids: [metric.service_ops.frt_global]
    dimensions: [region]
  - question: Which region has the highest FRT?
    intent: ranking
    metric_ids: [metric.service_ops.frt_global]
    dimensions: [region]
  - question: How many open cases are there?
    intent: aggregation
    notes: Row count of cases with status open.
  - question: What is FRT by account name?
    intent: breakdown
    metric_ids: [metric.service_ops.frt_global]
    dimensions: [account_name]
    notes: Uses the registered join cases.account_id = accounts.account_id.
