joins:
  - id: join.ops.case_to_account
    left_entity: service_case
    right_entity: account
    join_type: left
    cardinality: many_to_one
    keys:
      - left_entity: service_case
        left_column: account_id
        right_entity: account
        right_column: account_id
    condition: service_case.account_id = account.account_id
    grain_note: Many cases per account
    allowed_for_nlq: true
    approved_by: data.engineering
    inferred: false

  - id: join.ops.case_to_extension
    left_entity: service_case
    right_entity: case_extension
    join_type: left
    cardinality: one_to_one
    keys:
      - left_entity: service_case
        left_column: case_id
        right_entity: case_extension
        right_column: case_id
    condition: service_case.case_id = case_extension.case_id
    grain_note: Optional custom-object extension
    allowed_for_nlq: true
    approved_by: data.engineering
    inferred: false
