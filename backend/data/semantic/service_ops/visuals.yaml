domain: service_ops
# Bind frozen templates. Do not add new widget types here.
bindings:
  - id: vis.ops.frt_card
    template: kpi_card
    surface: dashboard
    metric_id: metric.service_ops.frt_global
  - id: vis.ops.frt_table
    template: table
    surface: dashboard
    metric_id: metric.service_ops.frt_global
    columns: [case_id, region, opened_at, first_response_at, status]
  - id: vis.ops.frt_trend
    template: trend
    surface: dashboard
    metric_id: metric.service_ops.frt_global
    time_dimension: opened_at
  - id: vis.ops.frt_compare
    template: comparison
    surface: copilot
    metric_id: metric.service_ops.frt_global
    compare_dimension: region
  - id: vis.ops.frt_root
    template: root_cause
    surface: drill
    metric_id: metric.service_ops.frt_global
    breakdown_dimensions: [region, account_id, status]
  - id: vis.ops.frt_dist
    template: distribution
    surface: dashboard
    metric_id: metric.service_ops.frt_global
    bucket_dimension: region
