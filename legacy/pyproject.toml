[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4bi"
version = "1.0.0"
description = "AI for BI: governed natural-language questions over registered datasets."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
formats = ["pyarrow>=14.0", "openpyxl>=3.1"]

[project.scripts]
ai4bi = "local.cli:main"

[tool.setuptools]
package-dir = { "" = "lib/python" }

[tool.setuptools.packages.find]
where = ["lib/python"]
include = ["ai4bi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib/python", "."]
markers = [
    "integration: end-to-end tests over the sample storage",
]
