version: 1
disable_existing_loggers: false

filters:
  request_context:
    (): ai4bi.logging.setup.RequestContextFilter

formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s [%(request_id)s] %(message)s"
  json:
    (): ai4bi.logging.setup.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    filters: [request_context]
    stream: ext://sys.stderr
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filters: [request_context]
    filename: logs/ai4bi.jsonl
    maxBytes: 5000000
    backupCount: 3
    encoding: utf-8

loggers:
  ai4bi:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
