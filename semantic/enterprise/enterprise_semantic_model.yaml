    applies_to_roles:
    - role.ent.bu_consumer
    - role.ent.analyst
    classification: pii
    notes: Steward may be granted via sensitive_columns.allowed_roles.
  sensitive_data_classifications:
  - id: class.pii
    name: Personally identifiable information
    default_action: deny
  - id: class.confidential
    name: Confidential business data
    default_action: mask
  aggregation_required_columns: []
  query_cost_guards:
