  - DELETE
  - UPDATE
  - INSERT
  - ALTER
  - TRUNCATE
  - MERGE
  - CREATE
  - REPLACE
  - GRANT
  - REVOKE
  - EXEC
  - EXECUTE
  - CALL
  - COPY
  - UNLOAD
  - LOAD
  - INTO
