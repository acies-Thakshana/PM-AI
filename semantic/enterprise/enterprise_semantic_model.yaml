    - dp.ent.fx_rates
    - dp.ent.dim_calendar
    - dp.ent.dim_organization
    - dp.ent.dim_customer
    - dp.ent.dim_product
    - dp.ent.dim_geography
    can_query_cross_bu: true
    maps_to_idp_group: <IDP_GROUP_SEMANTIC_STEWARD>
  row_level_policies:
  - id: rls.ent.fact_primary_bu
    data_product_id: dp.ent.fact_primary
    predicate: <CURATED_PRIMARY_FACT_DATASET>.<BU_CODE_COLUMN> IN (:authorized_bu_codes)
    applies_to_roles:
    - role.ent.bu_consumer
    - role.ent.analyst
    enforced_in_sql: true
    description: Restrict primary fact rows to authorized business units.
  - id: rls.ent.fact_targets_bu
    data_product_id: dp.ent.fact_targets
    predicate: <CURATED_TARGETS_DATASET>.<BU_CODE_COLUMN> IN (:authorized_bu_codes)
