semantic_versions:
- version: 0.1.0
  effective_date: '2026-09-10'
  status: deprecated
  change_summary: Initial placeholder enterprise semantic core.
  compatible_prompt_bundle: prompts.ent.core.0.1.0
  compatible_runtime: 0.1.0
- version: 0.2.0
  effective_date: '2026-09-15'
  status: draft
  change_summary: 'Local-first AI-for-BI design: NL-to-SQL interface pin, golden questions, DQ hooks,
    CLS, inheritance metadata.'
  compatible_prompt_bundle: prompts.ent.core.0.1.0
  compatible_runtime: 0.1.0
assumptions:
- Inspected local repository uses src/nlq for NL-to-SQL (LangGraph), not a python/ folder. Target layout
  python/ is a packaging assumption until NLSQL-01 closes.
- Existing NL-to-SQL must not be rebuilt in this phase; semantic planning and frontend integrate through
  contracts.
- All components currently run locally; Dataiku API Designer / Kubernetes / cloud hosting are future considerations
  only.
- NLQ may query only certified curated data products, never raw, quality, or standardization zones.
- The semantic layer is a metric, grain, join, and security contract, not a table-description dump.
- Metrics must be resolved into a semantic query plan before the existing NL-to-SQL component generates
  SQL.
- Security is enforced by deterministic Python and SQLGlot, independent of the LLM.
- Dashboard and chatbot share the same semantic definitions, auth context, and audit framework.
- 'Chatbot answers are dashboard-independent: a metric need not appear as a KPI card to be queryable.'
- Company-specific KPI formulae remain placeholders in this enterprise template. Domain YAML under semantic/domains/
  may hold certified definitions separately after governance approval.
- Local KPI parquet extract path <LOCAL_KPI_PARQUET_PATH> is an observed development fixture shape only
  until D-01 certifies the curated product.
- External GitHub semantic_layer reference was not fetchable (HTTP 404) at design time; treat as unresolved
  (GOV-11).
- BU extensions may add objects but must not override enterprise metric formulas in v0.2.0 without SM-08
  approval.
- New business units are onboarded by YAML configuration, not by rewriting agent or NL-to-SQL code.
unresolved_decisions:
- id: ud.ent.kpi_formula
  topic: Certified formula for <ENTERPRISE_PRIMARY_KPI>
  impact: SQL compilation and evaluation oracles cannot be finalized in the placeholder core.
  discovery_question_id: KPI-01
- id: ud.ent.nl_layout
  topic: Canonical package path python/ vs observed src/nlq
  impact: Integration docs and onboarding scripts.
  discovery_question_id: NLSQL-01
- id: ud.ent.nl_io
  topic: Frozen input/output JSON for existing NL-to-SQL entrypoints
  impact: Semantic query plan adapter shape.
  discovery_question_id: NLSQL-03
- id: ud.ent.frontend
  topic: Local frontend framework (Streamlit vs other)
  impact: Dashboard/chatbot implementation phase.
  discovery_question_id: FE-01
- id: ud.ent.local_auth
  topic: Local authentication approach for dashboard and chatbot
  impact: AuthN node and security-aware views.
  discovery_question_id: AUTH-01
- id: ud.ent.fx_method
  topic: FX conversion method and rate type
  impact: Value KPI answers may be incomparable across BUs.
  discovery_question_id: KPI-06
- id: ud.ent.fiscal_calendar
  topic: Fiscal year start and week-start day
  impact: Time intelligence and period comparisons are blocked.
  discovery_question_id: SM-04
- id: ud.ent.cross_bu_policy
  topic: Who may compare BUs and at what grain
  impact: Cross-BU routing and RLS bypass roles cannot be certified.
  discovery_question_id: XBU-01
- id: ud.ent.metric_override
  topic: Whether a BU may override an enterprise KPI
  impact: Merge policy is locked to no-override until this is decided.
  discovery_question_id: SM-08
- id: ud.ent.stale_behavior
  topic: Warn versus block on stale data products
  impact: Result-validation policy is incomplete.
  discovery_question_id: FR-03
- id: ud.ent.github_sem
  topic: Availability of external semantic_layer GitHub repository
  impact: Cannot import external semantic assets.
  discovery_question_id: GOV-11
