model_id: bu.example
model_kind: bu_extension
display_name: <BU_NAME> Semantic Extension
description: 'Example business-unit extension of the enterprise semantic core. Adds BU-owned curated data
  products, one operational KPI placeholder, and BU-scoped security. Does not override enterprise metric
  formulas.

  '
owner:
  role: <BU_SEMANTIC_OWNER_ROLE>
  team: <BU_NAME> analytics
  contact: <BU_SEMANTIC_OWNER_CONTACT>
status: draft
semantic_version: 0.2.0
compatibility:
  min_runtime_version: 0.1.0
  prompt_bundle_version: prompts.ent.core.0.1.0
  llm_model_pin: <LLM_MODEL_ID>
scope:
  company: <COMPANY_NAME>
  queryable_zones:
  - curated
  forbidden_query_zones:
  - raw
  - quality
  - standardization
  - evaluation
  - audit
  default_timezone: <DEFAULT_TIMEZONE>
parent_model_id: ent.core
business_unit:
  id: bu.example
  code: <BU_CODE>
  name: <BU_NAME>
  status: draft
  data_domain: <BU_DATA_DOMAIN>
  parent_bu_id: null
  authorized_roles:
  - <BU_ANALYST_ROLE>
  - <BU_CONSUMER_ROLE>
merge_policy:
  allow_metric_override: false
  allow_join_override: false
  allow_additional_metrics: true
  allow_additional_dimensions: true
  allow_additional_joins: true
  inherit_enterprise_security: true
data_products:
- id: dp.bu.example.fact_operational
  name: <BU_CURATED_OPERATIONAL_FACT_PRODUCT>
  description: Certified <BU_NAME> operational fact. Not a raw source table.
  zone: curated
  queryable: true
  physical_dataset: <BU_CURATED_OPERATIONAL_FACT_DATASET>
  database: <DATABASE_NAME>
  schema_name: <BU_SCHEMA_NAME>
  grain: <BU_OPERATIONAL_FACT_GRAIN>
  primary_keys:
  - <BU_OPERATIONAL_FACT_KEY>
  columns:
  - name: <BU_OPERATIONAL_FACT_KEY>
    data_type: string
    role: key
    sensitive: false
  - name: <DATE_KEY>
    data_type: date
    role: foreign_key
    sensitive: false
  - name: <ORGANIZATION_KEY>
    data_type: string
    role: foreign_key
    sensitive: false
  - name: <BU_CODE_COLUMN>
    data_type: string
    role: degenerate
    sensitive: false
  - name: <PRODUCT_KEY>
    data_type: string
    role: foreign_key
    sensitive: false
  - name: <SPECIALTY_KEY>
    data_type: string
    role: foreign_key
    sensitive: false
  - name: <BU_OPERATIONAL_MEASURE_COLUMN>
    data_type: <NUMERIC_TYPE>
    role: measure
    sensitive: false
    unit_id: unit.bu.example.operational
  - name: <BU_SENSITIVE_COLUMN>
    data_type: string
    role: attribute
    sensitive: true
  - name: <LAST_REFRESHED_AT>
    data_type: timestamp
    role: timestamp
    sensitive: false
  owner:
    role: <BU_DATA_PRODUCT_OWNER_ROLE>
    team: <BU_NAME> data
  status: draft
  contains_pii: true
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
- id: dp.bu.example.dim_specialty
  name: <BU_CURATED_SPECIALTY_DIMENSION_PRODUCT>
  description: Certified <BU_NAME>-specific specialty or process dimension.
  zone: curated
  queryable: true
  physical_dataset: <BU_CURATED_SPECIALTY_DIMENSION_DATASET>
  database: <DATABASE_NAME>
  schema_name: <BU_SCHEMA_NAME>
  grain: <BU_SPECIALTY_GRAIN>
  primary_keys:
  - <SPECIALTY_KEY>
  columns:
  - name: <SPECIALTY_KEY>
    data_type: string
    role: key
    sensitive: false
  - name: <SPECIALTY_NAME>
    data_type: string
    role: attribute
    sensitive: false
  - name: <SPECIALTY_GROUP>
    data_type: string
    role: attribute
    sensitive: false
  owner:
    role: <BU_DATA_PRODUCT_OWNER_ROLE>
    team: <BU_NAME> data
  status: draft
  contains_pii: false
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
metrics:
- id: metric.bu.example.operational_kpi
  name: <BU_OPERATIONAL_KPI>
  description: <BU_NAME> operational KPI. Formula is unresolved and must not be invented.
  owner:
    role: <BU_KPI_OWNER_ROLE>
    team: <BU_NAME> analytics
  status: draft
  definition_status: unresolved
  data_product_ids:
  - dp.bu.example.fact_operational
  grain: <BU_OPERATIONAL_FACT_GRAIN>
  measure:
    aggregation: unresolved
    sql_expression: <BU_KPI_FORMULA>
    filter_sql: <BU_KPI_FILTER_SQL>
  time_dimension_id: dim.ent.date
  unit_id: unit.bu.example.operational
  currency_rule_id: null
  additive_type: unresolved
  synonyms:
  - <BU_OPERATIONAL_KPI_SYNONYM>
  notes: Extends the enterprise core; does not replace <ENTERPRISE_PRIMARY_KPI>.
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  metric_owner:
    role: <BU_KPI_OWNER_ROLE>
    team: <BU_NAME> analytics
  semantic_owner:
    role: <BU_SEMANTIC_OWNER_ROLE>
    team: <BU_NAME> analytics
    contact: <BU_SEMANTIC_OWNER_CONTACT>
  compatibility:
    min_semantic_version: 0.2.0
    min_runtime_version: 0.1.0
    prompt_bundle_version: prompts.ent.core.0.1.0
dimensions:
- id: dim.bu.example.specialty
  name: <BU_SPECIALTY_DIMENSION>
  description: <BU_NAME>-specific specialty dimension used for operational drill-down.
  data_product_id: dp.bu.example.dim_specialty
  key_column: <SPECIALTY_KEY>
  label_column: <SPECIALTY_NAME>
  hierarchy:
  - <SPECIALTY_NAME>
  - <SPECIALTY_GROUP>
  attributes:
  - <SPECIALTY_KEY>
  - <SPECIALTY_NAME>
  - <SPECIALTY_GROUP>
  status: draft
  synonyms:
  - <BU_SPECIALTY_SYNONYM>
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
entities:
- id: ent.bu.example.operational_event
  name: <BU_NAME> operational event
  description: Grain of the <BU_NAME> operational fact product.
  data_product_id: dp.bu.example.fact_operational
  grain: <BU_OPERATIONAL_FACT_GRAIN>
  key_columns:
  - <BU_OPERATIONAL_FACT_KEY>
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
- id: ent.bu.example.specialty
  name: <BU_SPECIALTY_ENTITY>
  description: One <BU_NAME> specialty member.
  data_product_id: dp.bu.example.dim_specialty
  grain: <BU_SPECIALTY_GRAIN>
  key_columns:
  - <SPECIALTY_KEY>
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
relationships:
- id: rel.bu.example.operational_to_calendar
  from_entity_id: ent.bu.example.operational_event
  to_entity_id: ent.calendar
  cardinality: many_to_one
  description: BU operational fact dated by the enterprise calendar product.
  join:
    type: left
    left_data_product_id: dp.bu.example.fact_operational
    right_data_product_id: dp.ent.dim_calendar
    condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<DATE_KEY> = <CURATED_CALENDAR_DATASET>.<DATE_KEY>
    cardinality: many_to_one
  approved: true
  approved_by: <BU_DATA_GOVERNANCE_ROLE>
  status: draft
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  data_product_scope:
  - dp.bu.example.fact_operational
  - dp.ent.dim_calendar
  business_unit_scope:
  - <BU_CODE>
  security_considerations: BU RLS on operational fact is mandatory.
  validation_status: unvalidated
- id: rel.bu.example.operational_to_organization
  from_entity_id: ent.bu.example.operational_event
  to_entity_id: ent.organization
  cardinality: many_to_one
  join:
    type: left
    left_data_product_id: dp.bu.example.fact_operational
    right_data_product_id: dp.ent.dim_organization
    condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<ORGANIZATION_KEY> = <CURATED_ORGANIZATION_DATASET>.<ORGANIZATION_KEY>
    cardinality: many_to_one
  approved: true
  approved_by: <BU_DATA_GOVERNANCE_ROLE>
  status: draft
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  data_product_scope:
  - dp.bu.example.fact_operational
  - dp.ent.dim_organization
  business_unit_scope:
  - <BU_CODE>
  security_considerations: BU RLS on operational fact is mandatory.
  validation_status: unvalidated
- id: rel.bu.example.operational_to_product
  from_entity_id: ent.bu.example.operational_event
  to_entity_id: ent.product
  cardinality: many_to_one
  join:
    type: left
    left_data_product_id: dp.bu.example.fact_operational
    right_data_product_id: dp.ent.dim_product
    condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<PRODUCT_KEY> = <CURATED_PRODUCT_DATASET>.<PRODUCT_KEY>
    cardinality: many_to_one
  approved: true
  approved_by: <BU_DATA_GOVERNANCE_ROLE>
  status: draft
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  data_product_scope:
  - dp.bu.example.fact_operational
  - dp.ent.dim_product
  business_unit_scope:
  - <BU_CODE>
  security_considerations: BU RLS on operational fact is mandatory.
  validation_status: unvalidated
- id: rel.bu.example.operational_to_specialty
  from_entity_id: ent.bu.example.operational_event
  to_entity_id: ent.bu.example.specialty
  cardinality: many_to_one
  join:
    type: left
    left_data_product_id: dp.bu.example.fact_operational
    right_data_product_id: dp.bu.example.dim_specialty
    condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<SPECIALTY_KEY> = <BU_CURATED_SPECIALTY_DIMENSION_DATASET>.<SPECIALTY_KEY>
    cardinality: many_to_one
  approved: true
  approved_by: <BU_DATA_GOVERNANCE_ROLE>
  status: draft
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  data_product_scope:
  - dp.bu.example.fact_operational
  - dp.bu.example.dim_specialty
  business_unit_scope:
  - <BU_CODE>
  security_considerations: BU RLS on operational fact is mandatory.
  validation_status: unvalidated
approved_joins:
- id: join.bu.example.operational_to_calendar
  relationship_id: rel.bu.example.operational_to_calendar
  left_data_product_id: dp.bu.example.fact_operational
  right_data_product_id: dp.ent.dim_calendar
  join_type: left
  condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<DATE_KEY> = <CURATED_CALENDAR_DATASET>.<DATE_KEY>
  cardinality: many_to_one
  allowed_for_nlq: true
  notes: Uses the enterprise calendar product; does not redefine the calendar.
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  business_unit_scope:
  - <BU_CODE>
  security_considerations: Does not authorize cross-BU operational metric access.
  validation_status: unvalidated
- id: join.bu.example.operational_to_organization
  relationship_id: rel.bu.example.operational_to_organization
  left_data_product_id: dp.bu.example.fact_operational
  right_data_product_id: dp.ent.dim_organization
  join_type: left
  condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<ORGANIZATION_KEY> = <CURATED_ORGANIZATION_DATASET>.<ORGANIZATION_KEY>
  cardinality: many_to_one
  allowed_for_nlq: true
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  business_unit_scope:
  - <BU_CODE>
  security_considerations: Does not authorize cross-BU operational metric access.
  validation_status: unvalidated
- id: join.bu.example.operational_to_product
  relationship_id: rel.bu.example.operational_to_product
  left_data_product_id: dp.bu.example.fact_operational
  right_data_product_id: dp.ent.dim_product
  join_type: left
  condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<PRODUCT_KEY> = <CURATED_PRODUCT_DATASET>.<PRODUCT_KEY>
  cardinality: many_to_one
  allowed_for_nlq: true
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  business_unit_scope:
  - <BU_CODE>
  security_considerations: Does not authorize cross-BU operational metric access.
  validation_status: unvalidated
- id: join.bu.example.operational_to_specialty
  relationship_id: rel.bu.example.operational_to_specialty
  left_data_product_id: dp.bu.example.fact_operational
  right_data_product_id: dp.bu.example.dim_specialty
  join_type: left
  condition: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<SPECIALTY_KEY> = <BU_CURATED_SPECIALTY_DIMENSION_DATASET>.<SPECIALTY_KEY>
  cardinality: many_to_one
  allowed_for_nlq: true
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
  approved_direction: left_to_right
  business_unit_scope:
  - <BU_CODE>
  security_considerations: Does not authorize cross-BU operational metric access.
  validation_status: unvalidated
synonyms:
- term: <BU_OPERATIONAL_KPI_SYNONYM>
  maps_to_kind: metric
  maps_to_id: metric.bu.example.operational_kpi
  locale: <DEFAULT_LOCALE>
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
- term: <BU_SPECIALTY_SYNONYM>
  maps_to_kind: dimension
  maps_to_id: dim.bu.example.specialty
  locale: <DEFAULT_LOCALE>
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
- term: <BU_NAME>
  maps_to_kind: filter_value
  maps_to_id: dim.ent.business_unit
  locale: <DEFAULT_LOCALE>
  notes: Display name synonym; runtime must bind to <BU_CODE> via organization product.
  origin: bu_local
  inherits_from_id: null
  deprecation_status: active
  effective_date: '2026-09-15'
fiscal_calendars:
- id: cal.bu.example.inherited
  name: Inherited <ENTERPRISE_FISCAL_CALENDAR_NAME>
  data_product_id: dp.ent.dim_calendar
  fiscal_year_start_month: <FISCAL_YEAR_START_MONTH>
  week_start: unresolved
  definition_status: unresolved
  notes: BU must inherit the enterprise fiscal calendar; local fiscal calendars are out of scope until
    SM-05 is decided.
currency_rules:
  id: rule.bu.example.inherited
  reporting_currency: <REPORTING_CURRENCY>
  fx_data_product_id: dp.ent.fx_rates
  conversion_method: <FX_CONVERSION_METHOD>
  rate_type: <FX_RATE_TYPE>
  definition_status: unresolved
  notes: Inherits enterprise FX policy. BU-local reporting currencies are unresolved.
unit_rules:
  default_unit_id: unit.bu.example.operational
  units:
  - id: unit.bu.example.operational
    name: <BU_OPERATIONAL_UNIT>
    kind: unresolved
    canonical_symbol: <BU_UNIT_SYMBOL>
    conversion_to_default: null
    definition_status: unresolved
security:
  enforcement_layer: deterministic_python_sqlglot
  llm_may_bypass: false
  select_only: true
  single_statement_only: true
  python_execution_allowed: false
  max_rows: 500
  query_timeout_seconds: 30
  roles:
  - id: role.bu.example.consumer
    name: <BU_CONSUMER_ROLE>
    data_product_ids:
    - dp.bu.example.fact_operational
    - dp.bu.example.dim_specialty
    - dp.ent.dim_calendar
    - dp.ent.dim_organization
    - dp.ent.dim_product
    metric_ids:
    - metric.bu.example.operational_kpi
    - metric.ent.primary_kpi
    - metric.ent.volume_kpi
    can_query_cross_bu: false
    maps_to_idp_group: <IDP_GROUP_BU_CONSUMER>
  - id: role.bu.example.analyst
    name: <BU_ANALYST_ROLE>
    data_product_ids:
    - dp.bu.example.fact_operational
    - dp.bu.example.dim_specialty
    - dp.ent.fact_primary
    - dp.ent.dim_calendar
    - dp.ent.dim_organization
    - dp.ent.dim_product
    - dp.ent.dim_geography
    metric_ids:
    - metric.bu.example.operational_kpi
    - metric.ent.primary_kpi
    - metric.ent.volume_kpi
    - metric.ent.count_kpi
    - metric.ent.ratio_kpi
    can_query_cross_bu: false
    maps_to_idp_group: <IDP_GROUP_BU_ANALYST>
  row_level_policies:
  - id: rls.bu.example.operational_bu
    data_product_id: dp.bu.example.fact_operational
    predicate: <BU_CURATED_OPERATIONAL_FACT_DATASET>.<BU_CODE_COLUMN> = :authenticated_bu_code
    applies_to_roles:
    - role.bu.example.consumer
    - role.bu.example.analyst
    enforced_in_sql: true
    description: Force <BU_NAME> operational facts to the authenticated BU code.
  bu_filters:
  - id: buf.bu.example.operational
    data_product_id: dp.bu.example.fact_operational
    column: <BU_CODE_COLUMN>
    operator: eq
    value_source: authenticated_bu_code
    bypass_roles: []
  sensitive_columns:
  - data_product_id: dp.bu.example.fact_operational
    column: <BU_SENSITIVE_COLUMN>
    action: deny
    allowed_roles: []
    classification: confidential
  denied_operations:
  - DROP
  - DELETE
  - UPDATE
  - INSERT
  - ALTER
  - TRUNCATE
  - MERGE
  - CREATE
  - REPLACE
  - GRANT
  - REVOKE
  - EXEC
  - EXECUTE
  - CALL
  - COPY
  - UNLOAD
  - LOAD
  - INTO
  allowlisted_databases:
  - <DATABASE_NAME>
  allowlisted_schemas:
  - <BU_SCHEMA_NAME>
  - <SCHEMA_NAME>
  column_level_policies:
  - id: cls.bu.example.sensitive
    data_product_id: dp.bu.example.fact_operational
    column: <BU_SENSITIVE_COLUMN>
    action: deny
    applies_to_roles:
    - role.bu.example.consumer
    - role.bu.example.analyst
    classification: confidential
  sensitive_data_classifications:
  - id: class.confidential
    name: Confidential business data
    default_action: deny
  query_cost_guards:
    max_estimated_bytes: <MAX_QUERY_BYTES>
    max_joins: 4
    block_cartesian_joins: true
data_freshness:
- data_product_id: dp.bu.example.fact_operational
  sla_hours: <FRESHNESS_SLA_HOURS>
  freshness_column: <LAST_REFRESHED_AT>
  stale_behavior: unresolved
  expected_update_cadence: <BU_OPERATIONAL_UPDATE_CADENCE>
- data_product_id: dp.bu.example.dim_specialty
  sla_hours: <FRESHNESS_SLA_HOURS>
  freshness_column: <SPECIALTY_NAME>
  stale_behavior: warn
  expected_update_cadence: <BU_SPECIALTY_UPDATE_CADENCE>
sample_questions:
- id: sq.bu.example.trend
  question: What is the <BU_OPERATIONAL_KPI> trend for <BU_NAME> over the last <N> months?
  question_class: trend
  expected_behavior: answer
  metric_ids:
  - metric.bu.example.operational_kpi
  dimension_ids:
  - dim.ent.date
- id: sq.bu.example.drill
  question: Break down <BU_OPERATIONAL_KPI> by <BU_SPECIALTY_DIMENSION> for <FISCAL_PERIOD>.
  question_class: drill_down
  expected_behavior: answer
  metric_ids:
  - metric.bu.example.operational_kpi
  dimension_ids:
  - dim.bu.example.specialty
- id: sq.bu.example.root_cause
  question: Why did <BU_OPERATIONAL_KPI> change versus last <TIME_GRAIN> in <BU_NAME>?
  question_class: root_cause
  expected_behavior: answer
  metric_ids:
  - metric.bu.example.operational_kpi
  notes: Root-cause exploration is limited to certified dimensions and must not invent drivers.
- id: sq.bu.example.unauthorized_cross
  question: Show <BU_OPERATIONAL_KPI> for every business unit.
  question_class: unauthorized
  expected_behavior: refuse_unauthorized
  metric_ids:
  - metric.bu.example.operational_kpi
  requires_cross_bu: true
  notes: BU consumer and analyst roles cannot query other BUs with this metric.
- id: sq.bu.example.unsupported_python
  question: Run a custom Python simulation on the raw <BU_NAME> tables.
  question_class: unsupported
  expected_behavior: refuse_unsupported
  metric_ids: []
semantic_versions:
- version: 0.1.0
  effective_date: '2026-09-10'
  status: deprecated
  change_summary: Initial example BU extension template.
  compatible_prompt_bundle: prompts.ent.core.0.1.0
  compatible_runtime: 0.1.0
- version: 0.2.0
  effective_date: '2026-09-15'
  status: draft
  change_summary: 'Aligned with local-first design: CLS, golden questions, DQ, inheritance metadata.'
  compatible_prompt_bundle: prompts.ent.core.0.1.0
  compatible_runtime: 0.1.0
assumptions:
- This file is a template. Replace <BU_NAME> and related tokens during onboarding; do not copy invented
  KPIs.
- Enterprise objects are referenced by id and merged at runtime; they are not duplicated as new enterprise
  metrics.
- BU security tightens or scopes enterprise security; it cannot weaken SELECT-only or RLS enforcement.
- Cross-BU use of <BU_OPERATIONAL_KPI> is denied for BU-local roles.
- Chatbot may answer <BU_OPERATIONAL_KPI> questions even when the dashboard does not show that KPI card.
unresolved_decisions:
- id: ud.bu.example.kpi_formula
  topic: Certified formula for <BU_OPERATIONAL_KPI>
  impact: BU operational answers cannot be compiled.
  discovery_question_id: KPI-03
- id: ud.bu.example.unit
  topic: Canonical unit for <BU_OPERATIONAL_KPI>
  impact: Comparisons to enterprise metrics may be invalid.
  discovery_question_id: KPI-07
- id: ud.bu.example.specialty_grain
  topic: Grain and slowly-changing behavior of <BU_SPECIALTY_DIMENSION>
  impact: Drill-down uniqueness and historical restatement are unknown.
  discovery_question_id: SM-06
- id: ud.bu.example.shared_vs_local
  topic: Which <BU_NAME> questions should use enterprise KPIs versus the operational KPI
  impact: Intent routing and metric resolution policy.
  discovery_question_id: BUS-04
- id: ud.bu.example.dashboard_cards
  topic: Which BU KPIs appear as default dashboard cards
  impact: Frontend configuration only; does not limit chatbot metric access.
  discovery_question_id: FE-04
nl_to_sql_interface:
  plan_schema_version: semantic_query_plan.v1
  expects_semantic_query_plan: true
  must_not_bypass_plan: true
  existing_entrypoints:
  - <EXISTING_NL_TO_SQL_ENTRYPOINT>
  notes: BU extensions supply objects to the merged model; they do not call NL-to-SQL directly.
data_quality:
- id: dq.bu.example.op_pk
