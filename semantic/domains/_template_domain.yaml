# Example domain pack template (copy to semantic/domains/<name>.yaml)
# Then register the physical file in config/data_products.yaml

model_id: ent.example_domain
model_kind: domain_pack
display_name: Example domain pack
description: Template for a reusable multi-BU / multi-dataset semantic domain.
owner:
  role: Domain owner
  team: Analytics
  contact: ""
status: draft
semantic_version: 0.1.0
scope:
  company: Carrier
  queryable_zones: [curated]
  forbidden_query_zones: [raw, quality, standardization, evaluation, audit]
  default_timezone: America/New_York
data_products:
  - id: dp.bu.example.fact
    name: Example curated fact
    description: Replace with a real curated product.
    zone: curated
    queryable: true
    physical_dataset: example_fact
    database: ""
    schema_name: ""
    grain: one fact row
    primary_keys: [id]
    columns:
      - name: business_unit
        data_type: string
        role: degenerate
        sensitive: false
      - name: amount
        data_type: double
        role: measure
        sensitive: false
    status: draft
    contains_pii: false
metrics:
  - id: metric.ent.example_amount
    name: Example amount
    description: SUM of amount. Replace with certified formula.
    owner:
      role: KPI owner
      team: Analytics
    status: draft
    definition_status: proposed
    data_product_ids: [dp.bu.example.fact]
    grain: one fact row
    measure:
      aggregation: sum
      sql_expression: SUM("amount")
      filter_sql: null
    unit_id: unit.currency
    additive_type: additive
    synonyms: [amount, total amount]
dimensions:
  - id: dim.ent.example_bu
    name: Business unit
    description: BU on the fact.
    data_product_id: dp.bu.example.fact
    key_column: business_unit
    label_column: business_unit
    attributes: [business_unit]
    status: draft
    synonyms: [BU, business unit]
security:
  enforcement_layer: deterministic_python_sqlglot
  llm_may_bypass: false
  select_only: true
  single_statement_only: true
  max_rows: 500
  roles:
    - id: role.ent.cross_bu_analyst
      name: HQ / cross-BU analyst
      data_product_ids: [dp.bu.example.fact]
      can_query_cross_bu: true
    - id: role.ent.bu_consumer
      name: BU analyst
      data_product_ids: [dp.bu.example.fact]
      metric_ids: [metric.ent.example_amount]
      can_query_cross_bu: false
  row_level_policies:
    - id: rls.ent.example_bu
      data_product_id: dp.bu.example.fact
      predicate: example_fact.business_unit IN (:authorized_bu_codes)
      applies_to_roles: [role.ent.bu_consumer]
      enforced_in_sql: true
sample_questions:
  - id: sq.ent.example.total
    question: What is the total amount across all BUs?
    question_class: aggregation
    expected_behavior: answer
    metric_ids: [metric.ent.example_amount]
