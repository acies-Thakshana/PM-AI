model_id: ent.kpi
model_kind: enterprise_core
display_name: Productivity KPI semantic domain pack
description: >
  Reusable domain pack for the productivity KPI cube
  T_AI_SEM_KPICUBE_DETAILS (DSS dataset KPI_data). Denormalized fact:
  dimensions are columns on the cube. Additive metrics must be SUM'd.
  Initiative x site x quarter is not unique. Register the physical file in
  config/data_products.yaml (id: dp.ent.kpicube). Other dashboards add their
  own domain packs beside this file — they are merged at runtime.
  (model_kind stays enterprise_core for NLQ schema compatibility.)
owner:
  role: Enterprise KPI council
  team: Supply chain analytics
  contact: ""
status: certified
semantic_version: 0.2.0
compatibility:
  min_runtime_version: 0.6.0
  prompt_bundle_version: prompts.ent.core.0.1.0
  # Runtime model is NLQ_LLM_CONNECTION / AIBI_LLM_CONNECTION (Opus Mesh id).
  llm_model_pin: opus
scope:
  company: Carrier
  queryable_zones:
    - curated
  forbidden_query_zones:
    - raw
    - quality
    - standardization
    - evaluation
    - audit
  default_timezone: America/New_York
parent_model_id: null
business_unit: null
data_products:
  - id: dp.ent.kpicube
    name: Productivity KPI cube
    description: >
      Extract of AICORE_CAR_AI_DEV_DB.GF_SC_AI4631_BI.T_AI_SEM_KPICUBE_DETAILS.
      Physical grain is finer than initiative x site x quarter (median 3 rows;
      max 2755; 143140 rows have null Initiative ID). Time grain includes Month RPT.
    zone: curated
    queryable: true
    physical_dataset: KPI_data
    database: AICORE_CAR_AI_DEV_DB
    schema_name: GF_SC_AI4631_BI
    grain: atomic productivity fact (month, site, pillar, and other attributes; initiative often null)
    primary_keys:
      - Initiative ID
      - Site Name
      - Month RPT
      - Pillar Type
    columns:
      - name: BU
        data_type: string
        role: degenerate
        sensitive: false
        description: Business unit. Official members only; leftover labels (CS Americas) are not CSA.
      - name: Site Name
        data_type: string
        role: attribute
        sensitive: false
      - name: Pillar Type
        data_type: string
        role: attribute
        sensitive: false
        description: Direct, Indirect, or Logistics.
      - name: Initiative ID
        data_type: string
        role: key
        sensitive: false
      - name: Initiative name
        data_type: string
        role: attribute
        sensitive: false
      - name: Year RPT
        data_type: integer
        role: attribute
        sensitive: false
      - name: Quarter RPT
        data_type: string
        role: attribute
        sensitive: false
      - name: Month RPT
        data_type: string
        role: attribute
        sensitive: false
      - name: Actual Productivity
        data_type: double
        role: measure
        sensitive: false
        unit_id: unit.currency
        description: Non-probability-weighted productivity. Default metric for "productivity".
      - name: Forecast Productivity Plan
        data_type: double
        role: measure
        sensitive: false
        unit_id: unit.currency
        description: Target / plan.
      - name: Agg Productivity
        data_type: double
        role: measure
        sensitive: false
        unit_id: unit.currency
        description: Probability-weighted productivity. Use only when the question says probability.
      - name: Data Updated Date
        data_type: timestamp
        role: timestamp
        sensitive: false
    owner:
      role: KPI cube steward
      team: Supply chain analytics
    status: certified
    contains_pii: false
metrics:
  - id: metric.ent.actual_productivity
    name: Actual productivity
    description: SUM of Actual Productivity. Default meaning of productivity / actual / achieved.
    owner:
      role: KPI owner
      team: Enterprise KPI council
    status: certified
    definition_status: certified
    data_product_ids:
      - dp.ent.kpicube
    grain: atomic productivity fact (month, site, pillar, and other attributes; initiative often null)
    measure:
      aggregation: sum
      sql_expression: SUM("Actual Productivity")
      filter_sql: null
    time_dimension_id: dim.ent.date
    unit_id: unit.currency
    currency_rule_id: rule.ent.currency
    additive_type: additive
    synonyms:
      - productivity
      - actual productivity
      - total productivity
      - total actual productivity
      - achieved
      - achieved so far
      - non probability
      - non-prob
      - non probablity
      - non-probability weighted
    certified_by: KPI cube validation 2025 extract
    notes: Never LIMIT 1. Always SUM. Do not use Agg Productivity unless asked.
  - id: metric.ent.forecast_productivity
    name: Forecast productivity plan
    description: SUM of Forecast Productivity Plan. Meaning of target / plan / forecast.
    owner:
      role: KPI owner
      team: Enterprise KPI council
    status: certified
    definition_status: certified
    data_product_ids:
      - dp.ent.kpicube
    grain: atomic productivity fact (month, site, pillar, and other attributes; initiative often null)
    measure:
      aggregation: sum
      sql_expression: SUM("Forecast Productivity Plan")
      filter_sql: null
    time_dimension_id: dim.ent.date
    unit_id: unit.currency
    currency_rule_id: rule.ent.currency
    additive_type: additive
    synonyms:
      - target
      - plan
      - forecast
      - forecast productivity plan
      - target productivity
      - productivity plan
  - id: metric.ent.agg_productivity
    name: Probability-weighted productivity
    description: SUM of Agg Productivity. Use only for probability-weighted questions.
    owner:
      role: KPI owner
      team: Enterprise KPI council
    status: certified
    definition_status: certified
    data_product_ids:
      - dp.ent.kpicube
    grain: atomic productivity fact (month, site, pillar, and other attributes; initiative often null)
    measure:
      aggregation: sum
      sql_expression: SUM("Agg Productivity")
      filter_sql: null
    time_dimension_id: dim.ent.date
    unit_id: unit.currency
    currency_rule_id: rule.ent.currency
    additive_type: additive
    synonyms:
      - probability weighted
      - probablity
      - agg productivity
      - probability-weighted
  - id: metric.ent.performance_vs_target
    name: Performance versus target
    description: SUM(Actual) / NULLIF(SUM(Forecast), 0). Non-additive; compute after GROUP BY.
    owner:
      role: KPI owner
      team: Enterprise KPI council
    status: certified
    definition_status: certified
    data_product_ids:
      - dp.ent.kpicube
    grain: requested group (BU, site, or quarter)
    measure:
      aggregation: formula
      sql_expression: (SUM("Actual Productivity") * 1.0 / NULLIF(SUM("Forecast Productivity Plan"), 0))
      filter_sql: null
    time_dimension_id: dim.ent.date
    unit_id: unit.ratio
    currency_rule_id: null
    additive_type: non_additive
    synonyms:
      - performance
      - vs target
      - versus target
      - against the target
      - achievement
      - preforming against the target
      - performing against the target
    notes: Never average row-level ratios. Never SUM a pre-aggregated percent.
dimensions:
  - id: dim.ent.date
    name: Reporting time
    description: Year RPT, Quarter RPT, Month RPT on the cube. Q3 means Quarter RPT = Q3.
    data_product_id: dp.ent.kpicube
    key_column: Month RPT
    label_column: Quarter RPT
    hierarchy:
      - Month RPT
      - Quarter RPT
      - Year RPT
    attributes:
      - Year RPT
      - Quarter RPT
      - Month RPT
    status: certified
    synonyms:
      - quarter
      - Q3
      - year
      - month
  - id: dim.ent.business_unit
    name: Business unit
    description: Official BU on column BU. CSA is this dimension, not Site Name.
    data_product_id: dp.ent.kpicube
    key_column: BU
    label_column: BU
    attributes:
      - BU
    status: certified
    synonyms:
      - BU
      - business unit
      - CSA
  - id: dim.ent.site
    name: Site
    description: Site Name. CSA is not a site.
    data_product_id: dp.ent.kpicube
    key_column: Site Name
    label_column: Site Name
    attributes:
      - Site Name
    status: certified
    synonyms:
      - site
      - plant
  - id: dim.ent.pillar
    name: Pillar type
    description: Direct, Indirect, Logistics.
    data_product_id: dp.ent.kpicube
    key_column: Pillar Type
    label_column: Pillar Type
    attributes:
      - Pillar Type
    status: certified
    synonyms:
      - pillar
      - direct
      - directs
      - indirect
      - logistics
  - id: dim.ent.initiative
    name: Initiative
    description: Project / initiative. Rank by Initiative ID plus name.
    data_product_id: dp.ent.kpicube
    key_column: Initiative ID
    label_column: Initiative name
    attributes:
      - Initiative ID
      - Initiative name
    status: certified
    synonyms:
      - project
      - projects
      - initiative
      - initiatives
entities:
  - id: ent.kpicube_event
    name: KPI cube row
    description: One atomic productivity fact row.
    data_product_id: dp.ent.kpicube
    grain: atomic productivity fact (month, site, pillar, and other attributes; initiative often null)
    key_columns:
      - Initiative ID
      - Site Name
      - Month RPT
      - Pillar Type
  - id: ent.business_unit
    name: Business unit
    description: Degenerate BU member on the cube.
    data_product_id: dp.ent.kpicube
    grain: one BU label
    key_columns:
      - BU
    natural_keys:
      - BU
relationships:
  - id: rel.ent.kpicube_to_bu
    from_entity_id: ent.kpicube_event
    to_entity_id: ent.business_unit
    cardinality: many_to_one
    description: Degenerate BU on the denormalized cube; no physical join.
    join:
      type: left
      left_data_product_id: dp.ent.kpicube
      right_data_product_id: dp.ent.kpicube
      condition: KPI_data.BU = KPI_data.BU
      cardinality: many_to_one
    approved: true
    approved_by: Semantic v1
    status: certified
approved_joins:
  - id: join.ent.kpicube_degenerate_bu
    relationship_id: rel.ent.kpicube_to_bu
    left_data_product_id: dp.ent.kpicube
    right_data_product_id: dp.ent.kpicube
    join_type: left
    condition: KPI_data.BU = KPI_data.BU
    cardinality: many_to_one
    allowed_for_nlq: false
    notes: Cube is denormalized. NLQ must not emit this join.
synonyms:
  - term: CSA
    maps_to_kind: filter_value
    maps_to_id: dim.ent.business_unit
    locale: en
    canonical_value: Climate Solutions Americas
    notes: CSA is a BU, never Site Name.
  - term: Climate Solutions America
    maps_to_kind: filter_value
    maps_to_id: dim.ent.business_unit
    locale: en
    canonical_value: Climate Solutions Americas
  - term: APAC MEA
    maps_to_kind: filter_value
    maps_to_id: dim.ent.business_unit
    locale: en
    canonical_value: Climate Solutions Asia Pacific Middle East & Africa
  - term: productivity
    maps_to_kind: metric
    maps_to_id: metric.ent.actual_productivity
    locale: en
  - term: target
    maps_to_kind: metric
    maps_to_id: metric.ent.forecast_productivity
    locale: en
  - term: performance
    maps_to_kind: metric
    maps_to_id: metric.ent.performance_vs_target
    locale: en
  - term: directs
    maps_to_kind: filter_value
    maps_to_id: dim.ent.pillar
    locale: en
    canonical_value: Direct
  - term: project
    maps_to_kind: dimension
    maps_to_id: dim.ent.initiative
    locale: en
  - term: BU
    maps_to_kind: dimension
    maps_to_id: dim.ent.business_unit
    locale: en
fiscal_calendars:
  - id: cal.ent.fiscal
    name: Reporting calendar on the KPI cube
    data_product_id: dp.ent.kpicube
    fiscal_year_start_month: 1
    week_start: unresolved
    definition_status: proposed
    notes: Year RPT 2025 extract is calendar year until finance certifies fiscal start.
currency_rules:
  id: rule.ent.currency
  reporting_currency: USD
  fx_data_product_id: dp.ent.kpicube
  conversion_method: amounts stored in cube; no FX conversion in v1
  rate_type: none
  definition_status: proposed
  notes: Confirm reporting currency with finance. v1 sums cube amounts as stored.
unit_rules:
  default_unit_id: unit.currency
  units:
    - id: unit.currency
      name: Currency amount
      kind: currency
      canonical_symbol: USD
      conversion_to_default: null
      definition_status: proposed
    - id: unit.ratio
      name: Ratio
      kind: ratio
      canonical_symbol: "%"
      conversion_to_default: null
      definition_status: certified
security:
  enforcement_layer: deterministic_python_sqlglot
  llm_may_bypass: false
  select_only: true
  single_statement_only: true
  python_execution_allowed: false
  max_rows: 500
  query_timeout_seconds: 30
  roles:
    - id: role.ent.bu_consumer
      name: BU analyst
      data_product_ids:
        - dp.ent.kpicube
      metric_ids:
        - metric.ent.actual_productivity
        - metric.ent.forecast_productivity
        - metric.ent.agg_productivity
        - metric.ent.performance_vs_target
      can_query_cross_bu: false
      maps_to_idp_group: ""
    - id: role.ent.cross_bu_analyst
      name: HQ / cross-BU analyst
      data_product_ids:
        - dp.ent.kpicube
      can_query_cross_bu: true
      maps_to_idp_group: ""
  row_level_policies:
    - id: rls.ent.kpicube_bu
      data_product_id: dp.ent.kpicube
      predicate: KPI_data.BU IN (:authorized_bu_codes)
      applies_to_roles:
        - role.ent.bu_consumer
      enforced_in_sql: true
      description: Restrict cube rows to authorized official BU names.
  bu_filters:
    - id: buf.ent.kpicube
      data_product_id: dp.ent.kpicube
      column: BU
      operator: in
      value_source: authenticated_bu_codes
      bypass_roles:
        - role.ent.cross_bu_analyst
  sensitive_columns: []
  denied_operations:
    - DROP
    - DELETE
    - UPDATE
    - INSERT
    - ALTER
    - TRUNCATE
    - MERGE
    - CREATE
    - REPLACE
    - GRANT
    - REVOKE
    - EXEC
    - EXECUTE
    - CALL
    - COPY
    - UNLOAD
    - LOAD
    - INTO
data_freshness:
  - data_product_id: dp.ent.kpicube
    sla_hours: 24
    freshness_column: Data Updated Date
    stale_behavior: warn
    expected_update_cadence: daily cube refresh
sample_questions:
  - id: sq.ent.kpi.total
    question: What is the total productivity achieved so far?
    question_class: aggregation
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
  - id: sq.ent.kpi.split
    question: Can you give me the split of productivity across direct, indirect and logistics?
    question_class: split
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
    dimension_ids:
      - dim.ent.pillar
  - id: sq.ent.kpi.q3.projects
    question: Which BU has the highest productivity in Q3? Name the top 3 projects
    question_class: ranking
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
    dimension_ids:
      - dim.ent.business_unit
      - dim.ent.initiative
      - dim.ent.date
  - id: sq.ent.kpi.top20
    question: What are the top 20 projects and which site and BU it belongs to?
    question_class: ranking
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
    dimension_ids:
      - dim.ent.initiative
      - dim.ent.site
      - dim.ent.business_unit
  - id: sq.ent.kpi.lowest.direct
    question: Which are the top 3 sites driving the lowest productivity in directs
    question_class: ranking
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
    dimension_ids:
      - dim.ent.site
      - dim.ent.pillar
  - id: sq.ent.kpi.under50
    question: List the top 5 sites which have not achieved 50% of their target so far
    question_class: target
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
      - metric.ent.forecast_productivity
      - metric.ent.performance_vs_target
    dimension_ids:
      - dim.ent.site
  - id: sq.ent.kpi.prob.diff
    question: What is the difference between the productivity under probablity and non probablity weighted?
    question_class: variance
    expected_behavior: answer
    metric_ids:
      - metric.ent.actual_productivity
      - metric.ent.agg_productivity
  - id: sq.ent.kpi.csa.q3
    question: What is the Q3 target for Climate Solutions America and how are we preforming against the target?
    question_class: target
    expected_behavior: answer
    metric_ids:
      - metric.ent.forecast_productivity
      - metric.ent.actual_productivity
      - metric.ent.performance_vs_target
    dimension_ids:
      - dim.ent.business_unit
      - dim.ent.date
  - id: sq.ent.kpi.rank.bu
    question: Can you please rank the BUs by performance?
    question_class: ranking
    expected_behavior: answer
    metric_ids:
      - metric.ent.performance_vs_target
    dimension_ids:
      - dim.ent.business_unit
    requires_cross_bu: true
  - id: sq.ent.kpi.ambiguous
    question: How are we performing?
    question_class: ambiguous
    expected_behavior: clarify
    metric_ids: []
  - id: sq.ent.kpi.unsupported
    question: Why did CSA miss the plan last year?
    question_class: unsupported
    expected_behavior: refuse_unsupported
    metric_ids: []
    notes: Narrative root cause is not in the cube.
semantic_versions:
  - version: 0.2.0
    effective_date: "2026-09-15"
    status: certified
    change_summary: Certified productivity cube metrics, grain, synonyms, and BU RLS contract.
    compatible_prompt_bundle: prompts.ent.core.0.1.0
    compatible_runtime: "0.6.0"
assumptions:
  - NLQ may query only KPI_data / T_AI_SEM_KPICUBE_DETAILS for this domain.
  - Default productivity is Actual Productivity, not Agg Productivity.
  - Performance is computed after aggregation.
  - CS Americas is not an alias of Climate Solutions Americas until an owner signs that merge.
  - Empty authorized_bu_codes means steward/eval mode (no RLS injection).
unresolved_decisions:
  - id: ud.ent.kpi.fiscal
    topic: Fiscal versus calendar year on Year RPT
    impact: YTD and Q3 comparisons if fiscal differs from calendar.
    discovery_question_id: SM-04
  - id: ud.ent.kpi.currency
    topic: Confirm amounts are USD
    impact: Cross-country comparability.
    discovery_question_id: KPI-06
  - id: ud.ent.kpi.idp
    topic: IdP group to BU role mapping
    impact: RLS cannot bind real users until SEC-01 is closed.
    discovery_question_id: SEC-01
