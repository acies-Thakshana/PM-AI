entities:
  - logical_entity: account
    source_system: salesforce
    source_object: Account
    physical_dataset: accounts
    data_product_id: dp.ops.accounts
    grain: one row per account_id
    primary_keys:
      - account_id
    entity_kind: master
    is_custom_object: false
    columns:
      - name: account_id
        data_type: string
        role: key
        description: Account primary key
      - name: account_name
        data_type: string
        role: attribute
      - name: region
        data_type: string
        role: attribute
        description: EMEA, APAC, or AMER

  - logical_entity: service_case
    source_system: salesforce
    source_object: Case
    physical_dataset: cases
    data_product_id: dp.ops.cases
    grain: one row per case_id
    primary_keys:
      - case_id
    entity_kind: transactional
    is_custom_object: false
    columns:
      - name: case_id
        data_type: string
        role: key
      - name: account_id
        data_type: string
        role: foreign_key
      - name: region
        data_type: string
        role: attribute
      - name: opened_at
        data_type: timestamp
        role: timestamp
      - name: first_response_at
        data_type: timestamp
        role: timestamp
      - name: status
        data_type: string
        role: attribute
      - name: contact_email
        data_type: string
        role: attribute
        pii_tag: restricted
        sensitive: true
        description: Tagged restricted by the data team. Never sent to the LLM.

  - logical_entity: case_extension
    source_system: salesforce
    source_object: Case_Extension__c
    physical_dataset: case_extension
    data_product_id: dp.ops.case_extension
    grain: one row per case_id
    primary_keys:
      - case_id
    entity_kind: transactional
    is_custom_object: true
    notes: Custom object. Registration only — no factory code change.
    columns:
      - name: case_id
        data_type: string
        role: key
      - name: severity_c
        data_type: string
        role: attribute
        description: Custom severity field
