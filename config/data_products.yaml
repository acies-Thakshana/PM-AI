# Generic multi-dataset registry for the semantic layer.
# Reuse this file for any dashboard: add one entry per curated data product.
# Semantic YAML metrics reference data_product ids; this file binds them to files.

version: "1"
default_product_id: dp.ent.kpicube

data_products:
  - id: dp.ent.kpicube
    name: Productivity KPI cube
    physical_dataset: KPI_data
    path: local_data/fixtures/KPI_data.parquet
    format: parquet
    bu_column: BU
    # Optional column aliases used by the generic runtime
    columns:
      actual: Actual Productivity
      forecast: Forecast Productivity Plan
      weighted: Agg Productivity
      pillar: Pillar Type
      site: Site Name
      quarter: Quarter RPT
      year: Year RPT
      month: Month RPT
      region: Region
      category: Category (L1)
      initiative_id: Initiative ID
      initiative_name: Initiative name
    notes: Enterprise productivity cube used by the KPI dashboard domain pack.

  - id: dp.ops.cases
    name: Service cases
    physical_dataset: cases
    path: local_data/fixtures/service_ops/cases.csv
    format: csv
    bu_column: region
    columns:
      opened: opened_at
      first_response: first_response_at
      region: region
    notes: Onboarded via the AI4BI contract. Source object is irrelevant at runtime.

  - id: dp.ops.accounts
    name: Service accounts
    physical_dataset: accounts
    path: local_data/fixtures/service_ops/accounts.csv
    format: csv
    bu_column: region
    notes: Master entity registered in onboarding/domains/service_ops/entities.yaml.

  - id: dp.ops.case_extension
    name: Case extension custom object
    physical_dataset: case_extension
    path: local_data/fixtures/service_ops/case_extension.csv
    format: csv
    notes: Salesforce custom object Case_Extension__c — metadata registration only.

  # Example template for another BU / dashboard dataset (uncomment + point to a file):
  # - id: dp.bu.finance.ledger
  #   name: Finance ledger (example)
  #   physical_dataset: finance_ledger
  #   path: local_data/fixtures/finance_ledger.parquet
  #   format: parquet
  #   bu_column: business_unit
